name: xrt-tutorial

services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  bacnet-sim:
    image: iotechsys/bacnet-sim:2.2
    container_name: bacnet-sim
    environment:
      RUN_MODE: IP
    volumes:
      - ./simulator/office-zone.lua:/scripts/office-zone.lua:ro
    command: ["--script", "/scripts/office-zone.lua", "--instance", "1234", "--name", "OfficeZone"]
    networks:
      default:
        # A fixed address keeps the tutorial simple: Xrt registers with the simulator at BACNET_SIM_ADDRESS.
        # Xrt also supports BACnet discovery.
        ipv4_address: 172.16.238.10

  sparkplug-client:
    image: iotechsys/sparkplug-client:3.2
    container_name: sparkplug-client
    command: ["sub", "-h", "mqtt-broker", "-t", "spBv1.0/#", "-quiet", "--webui", "-webui-port", "8090"]
    ports:
      - "8090:8090"
    depends_on:
      - mqtt-broker

networks:
  default:
    name: xrt-tutorial
    ipam:
      config:
        - subnet: 172.16.238.0/24
          ip_range: 172.16.238.128/25
