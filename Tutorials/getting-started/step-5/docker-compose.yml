name: xrt-getting-started

services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  sparkplug-client:
    image: iotechsys/sparkplug-client:3.2
    container_name: sparkplug-client
    command: ["sub", "-h", "mqtt-broker", "-t", "spBv1.0/#", "-quiet", "--webui", "-webui-port", "8090"]
    ports:
      - "8090:8090"
    depends_on:
      - mqtt-broker

  xrt:
    image: iotechsys/xrt:4.0
    container_name: xrt
    env_file: xrt.env
    # Show Xrt's log output as soon as it is written
    tty: true
    # Run Xrt as your user, so that the files it writes in deployment/ stay yours to change. If your
    # user and group IDs (id -u, id -g) are not 1000, set XRT_UID and XRT_GID to them
    user: "${XRT_UID:-1000}:${XRT_GID:-1000}"
    volumes:
      # The image runs Xrt against the deployment/config directory mounted here
      - ./deployment:/opt/iotech/xrt/4.0/deployment
      - ./license.json:/opt/iotech/xrt/4.0/license.json:ro
    depends_on:
      - mqtt-broker
